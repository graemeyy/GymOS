name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymos
          POSTGRES_PASSWORD: gymos
          POSTGRES_DB: gymos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway values. No real keys are used anywhere in CI.
      DATABASE_URL: postgresql://gymos:gymos@localhost:5432/gymos_ci_build_test
      TEST_DATABASE_URL: postgresql://gymos:gymos@localhost:5432/gymos_test
      E2E_DATABASE_URL: postgresql://gymos:gymos@localhost:5432/gymos_e2e_test
      SHADOW_DATABASE_URL: postgresql://gymos:gymos@localhost:5432/gymos_shadow_test
      ROLLBACK_DATABASE_URL: postgresql://gymos:gymos@localhost:5432/gymos_rollback_test
      FRESH_DATABASE_URL: postgresql://gymos:gymos@localhost:5432/gymos_fresh_test
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else-0123
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate gym config
        run: npm run check:config
      - name: Validate Prisma schema
        run: npx prisma validate
      # Fails if schema.prisma and the migrations disagree, i.e. someone
      # changed the schema without writing a migration (R-69).
      - name: Check migrations match the schema
        run: |
          PGPASSWORD=gymos psql -h localhost -U gymos -d gymos_test -c "CREATE DATABASE gymos_shadow_test"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Check every down.sql rolls back cleanly
        run: npm run check:rollback
      # A brand-new database must build from migrations alone, take the seed,
      # and report itself up to date (R-68).
      - name: Build a fresh database from migrations, seed it and check its status
        run: npm run check:fresh-db
      # Existing data moves to the main location and no stock is lost (D-125).
      - name: Locations migration keeps existing data
        run: npm run check:locations-migration
      # Every copy shows its own brand: the demo gym's name and details may
      # only appear in config and seed files (D-124).
      - name: No demo gym text outside config and seed files
        run: npx vitest run lib/branding/brand-text.test.ts
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
